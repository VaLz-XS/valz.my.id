from pathlib import Path

html = r'''<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brat Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  background:#f4f4f4; font-family:Arial,Helvetica,sans-serif; color:#111;
  padding:24px;
}
.wrap{width:min(920px,100%)}
h1{font-size:34px;margin:0 0 8px;font-weight:800}
.sub{margin:0 0 22px;color:#666}
.card{
  background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.07);
}
textarea{
  width:100%;min-height:110px;resize:vertical;border:1px solid #ccc;
  border-radius:12px;padding:14px;font-size:18px;outline:none;
}
textarea:focus{border-color:#111}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{
  border:0;border-radius:10px;padding:12px 18px;font-weight:700;
  cursor:pointer;background:#111;color:#fff;font-size:15px;
}
button.secondary{background:#eee;color:#111}
.preview{
  margin-top:20px;display:flex;justify-content:center;align-items:center;
  background:#eee;border-radius:14px;padding:20px;min-height:300px;
}
canvas{
  width:min(500px,100%);height:auto;display:block;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}
small{display:block;margin-top:12px;color:#777}
@media(max-width:600px){
  h1{font-size:28px}
  .card{padding:15px}
  .preview{padding:10px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Brat Generator</h1>
  <p class="sub">Bikin gambar teks bergaya Brat langsung dari browser.</p>

  <div class="card">
    <textarea id="text" placeholder="Tulis sesuatu...">brat</textarea>

    <div class="controls">
      <button id="download">Download PNG</button>
      <button class="secondary" id="clear">Clear</button>
    </div>

    <div class="preview">
      <canvas id="canvas" width="1080" height="1080"></canvas>
    </div>
    <small>Semua proses dilakukan di browser kamu; tidak ada upload gambar ke server.</small>
  </div>
</div>

<script>
const textarea = document.getElementById('text');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function wrapText(text, maxWidth, fontSize) {
  const words = text.trim().split(/\s+/);
  const lines = [];
  let line = "";

  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width <= maxWidth || !line) {
      line = test;
    } else {
      lines.push(line);
      line = word;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function draw() {
  const text = textarea.value || "";
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Brat-inspired pale green background
  ctx.fillStyle = "#8ace00";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let fontSize = 125;
  let lines;

  while (fontSize > 35) {
    ctx.font = `900 ${fontSize}px Arial, Helvetica, sans-serif`;
    lines = wrapText(text, 920, fontSize);
    if (lines.length <= 8) break;
    fontSize -= 5;
  }

  ctx.font = `900 ${fontSize}px Arial, Helvetica, sans-serif`;
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const lineHeight = fontSize * 0.88;
  const totalHeight = lines.length * lineHeight;
  let y = (canvas.height - totalHeight) / 2 + lineHeight / 2;

  for (const line of lines) {
    ctx.fillText(line, canvas.width/2, y);
    y += lineHeight;
  }
}

textarea.addEventListener("input", draw);

document.getElementById("clear").addEventListener("click", () => {
  textarea.value = "";
  draw();
  textarea.focus();
});

document.getElementById("download").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "brat.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

draw();
</script>
</body>
</html>
'''

path = Path("/mnt/data/brat-generator.html")
path.write_text(html, encoding="utf-8")
print(path)
