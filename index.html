
html = r'''<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaLz — Nature</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#06110d;color:#fff;font-family:Georgia,serif}.scene{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#071b24,#123b42 42%,#0b251c 72%,#040b08);isolation:isolate}.scene:before{content:"";position:absolute;inset:-10%;background:radial-gradient(circle at 72% 20%,rgba(255,238,181,.25),transparent 11%),radial-gradient(circle at 72% 20%,rgba(255,239,187,.08),transparent 25%);animation:glow 8s ease-in-out infinite alternate}@keyframes glow{to{transform:scale(1.08);opacity:.7}}.mist{position:absolute;left:-15%;width:130%;height:24%;background:rgba(218,244,232,.07);filter:blur(25px);border-radius:50%;animation:mist 18s ease-in-out infinite alternate}.m1{top:39%}.m2{top:57%;animation-duration:24s;opacity:.55}@keyframes mist{to{transform:translateX(8%)}}.moon{position:absolute;width:120px;height:120px;border-radius:50%;top:11%;right:14%;background:#fff2c9;box-shadow:0 0 45px rgba(255,240,190,.35)}.stars{position:absolute;inset:0}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3s ease-in-out infinite}@keyframes twinkle{50%{opacity:.1;transform:scale(.5)}}.mountain{position:absolute;left:-5%;width:110%;height:42%;bottom:15%;background:#081c17;clip-path:polygon(0 100%,0 72%,13% 52%,23% 70%,37% 35%,50% 68%,63% 43%,77% 71%,88% 48%,100% 68%,100% 100%)}.back{bottom:20%;opacity:.5;transform:scale(1.04)}.ground{position:absolute;left:-5%;bottom:-3%;width:110%;height:27%;background:#030907;clip-path:polygon(0 30%,12% 20%,24% 35%,39% 14%,53% 32%,67% 18%,82% 31%,100% 12%,100% 100%,0 100%)}.tree{position:absolute;bottom:5%;width:130px;height:230px;z-index:3}.tree:before{content:"";position:absolute;bottom:0;left:57px;width:15px;height:130px;background:#070d0a;border-radius:10px}.tree:after{content:"";position:absolute;left:0;top:0;width:130px;height:160px;background:#050d09;clip-path:polygon(50% 0,68% 26%,57% 25%,83% 48%,64% 47%,100% 76%,69% 72%,85% 100%,50% 82%,15% 100%,31% 72%,0 76%,36% 47%,17% 48%,43% 25%,32% 26%)}.t1{left:-15px;transform:scale(1.1)}.t2{right:-25px;transform:scale(1.25)}.content{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}.kicker{letter-spacing:7px;text-transform:uppercase;font:700 11px Arial,sans-serif;color:#ffffff99;margin-bottom:18px}h1{margin:0;font-size:clamp(90px,25vw,260px);line-height:.8;letter-spacing:-9px;font-weight:400;text-shadow:0 0 35px #d2ffe21f;animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.sub{margin-top:28px;color:#ffffffad;font:14px Arial,sans-serif;letter-spacing:3px}.player{position:absolute;z-index:20;bottom:28px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 32px));padding:12px 14px;border:1px solid #ffffff1f;background:#040a0875;backdrop-filter:blur(14px);border-radius:18px;display:flex;align-items:center;gap:12px}.play{width:42px;height:42px;border:0;border-radius:50%;background:#e8f2dc;color:#07110c;font-size:16px;cursor:pointer}.track{min-width:0;flex:1;text-align:left}.track b{display:block;font:700 13px Arial}.track span{display:block;margin-top:3px;color:#ffffff80;font:11px Arial}.credit{position:absolute;z-index:20;top:22px;left:24px;font:700 12px Arial;letter-spacing:3px;color:#ffffffa6}@media(max-width:600px){.moon{width:80px;height:80px;right:12%;top:13%}.sub{font-size:11px;letter-spacing:2px}.player{bottom:18px}}
</style></head><body><div class="scene"><div class="stars" id="stars"></div><div class="moon"></div><div class="mist m1"></div><div class="mist m2"></div><div class="mountain back"></div><div class="mountain"></div><div class="tree t1"></div><div class="tree t2"></div><div class="ground"></div><div class="credit">VaLz</div><main class="content"><div class="kicker">a quiet place</div><h1>val</h1><div class="sub">breathe slowly · stay awhile</div></main><div class="player"><button class="play" id="play">▶</button><div class="track"><b>Killswitch Lullaby</b><span id="status">Tambahkan MP3 untuk memutar</span></div><audio id="audio" loop preload="metadata"><source src="killswitch-lullaby.mp3" type="audio/mpeg"></audio></div></div><script>
