<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>valz.my.id</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:   #FF3CAC;
      --purple: #784BA0;
      --blue:   #2B86C5;
      --yellow: #FFD93D;
      --coral:  #FF6B6B;
      --mint:   #6BCB77;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #FF3CAC, #784BA0, #2B86C5);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating bubbles */
    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bubble {
      position: absolute;
      bottom: -120px;
      border-radius: 50%;
      opacity: 0.25;
      animation: rise linear infinite;
    }

    @keyframes rise {
      to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 32px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    }

    .emoji-ring {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg) scale(1); }
      50%  { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2rem, 8vw, 3rem);
      color: #fff;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.85);
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .tag {
      padding: 0.35rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .tag:nth-child(1) { background: var(--pink); }
    .tag:nth-child(2) { background: var(--mint); }
    .tag:nth-child(3) { background: var(--yellow); color: #333; }
    .tag:nth-child(4) { background: var(--coral); }
    .tag:nth-child(5) { background: var(--purple); }

    .btn {
      display: inline-block;
      padding: 0.8rem 2.2rem;
      background: var(--yellow);
      color: #333;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      border-radius: 999px;
      text-decoration: none;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover, .btn:focus {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 rgba(0,0,0,0.15);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: 1.5rem;
      color: rgba(255,255,255,0.6);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- Bubbles background -->
  <div class="bubbles" id="bubbles"></div>

  <!-- Main card -->
  <div class="card">
    <span class="emoji-ring">🌈</span>
    <h1>Halo, Selamat Datang!</h1>
    <p class="tagline">Website ini sedang dalam pengerjaan ✨</p>

    <div class="tags">
      <span class="tag">🎨 Creative</span>
      <span class="tag">🌟 Fun</span>
      <span class="tag">⚡ Energic</span>
      <span class="tag">💖 Colorful</span>
      <span class="tag">🚀 Coming Soon</span>
    </div>

    <a href="#" class="btn">🎉 Stay Tuned!</a>
  </div>

  <p class="footer">© 2026 valz.my.id — Made with 💜</p>

  <script>
    // Generate floating bubbles
    const colors = ['#FF3CAC','#FFD93D','#6BCB77','#2B86C5','#FF6B6B','#784BA0'];
    const container = document.getElementById('bubbles');

    for (let i = 0; i < 18; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 30 + Math.random() * 80;
      b.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        left: ${Math.random() * 100}%;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${6 + Math.random() * 10}s;
        animation-delay: ${Math.random() * 8}s;
      `;
      container.appendChild(b);
    }
  </script>
</body>
</html>
